# Optimized for Snapdragon 685: Efficiency-first with UI Snappiness
# PRIO: We prioritize the first 3 efficiency cores (Little) for general tasks 
# and reserve the Big cores for heavy UI rendering only.
PRIO=1,1,1,1,0,0,0,0

# IGNORED_IRQ: Added 20, 23, and 30 to the ignore list.
# This prevents the balancer from moving critical display and timer interrupts,
# which reduces "jitter" when scrolling.
IGNORED_IRQ=19,20,22,23,28,30,31,33,34,35,39,44,45,47,49,135,136,213,282,283,284,285