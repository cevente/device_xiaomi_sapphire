name: Android UDFPS Module CI

on:
  push:
    branches: [ "lineage-23.2" ]
  pull_request:
    branches: [ "lineage-23.2" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Install essential Android building blocks
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libssl-dev python-is-python3

    # 2. Fetch the absolute latest Repo tool from Google
    - name: Install Latest Repo Tool
      run: |
        mkdir -p ~/.bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod a+x ~/.bin/repo
        sudo mv ~/.bin/repo /usr/local/bin/repo

    # 3. Look for a saved copy of the Lineage tree from a previous run
    - name: Cache LineageOS Source Tree
      id: cache-lineage
      uses: actions/cache@v4
      with:
        path: lineage
        key: lineage-23.2-minimal-v5

    # 4. Initialize the LineageOS tree (Only runs if cache is empty)
    - name: Initialize Repo
      if: steps.cache-lineage.outputs.cache-hit != 'true'
      run: |
        git config --global user.name "CloudBuilder"
        git config --global user.email "builder@cloud.local"
        mkdir -p lineage
        cd lineage
        repo init -u https://github.com/LineageOS/android.git -b lineage-23.2 --depth=1

    # 5. Sync folders (Added build/release, Go compiler, bionic, and libbase)
    - name: Shallow Sync Required Repositories
      run: |
        cd lineage
        repo sync build/make build/soong build/blueprint build/release prebuilts/build-tools prebuilts/go/linux-x86 prebuilts/clang/host/linux-x86 system/core system/libbase system/logging hardware/interfaces bionic -c -j$(nproc)

    # 6. Clone LineageOS Vendor Configuration
    - name: Clone LineageOS Vendor Configuration
      run: |
        rm -rf lineage/vendor/lineage
        git clone --depth=1 https://github.com/LineageOS/android_vendor_lineage.git -b lineage-23.2 lineage/vendor/lineage

    # 7. Clone Xiaomi hardware tree to get the required headers
    - name: Clone LineageOS Xiaomi Hardware Dependency
      run: |
        rm -rf lineage/hardware/xiaomi
        git clone --depth=1 https://github.com/LineageOS/android_hardware_xiaomi.git -b lineage-23.2 lineage/hardware/xiaomi

    # 8. Checkout your custom code to a temporary directory
    - name: Checkout Custom Module
      uses: actions/checkout@v4
      with:
        path: custom_src

    # 9. Inject your customized code over the base fingerprint implementation
    - name: Inject Custom Code into Tree
      run: |
        cp -v custom_src/udfps/Android.bp lineage/hardware/xiaomi/fingerprint/
        cp -v custom_src/udfps/UdfpsHandler.cpp lineage/hardware/xiaomi/fingerprint/
        cp -v custom_src/udfps/xiaomi_touch.h lineage/hardware/xiaomi/fingerprint/
        [ -f custom_src/udfps/UdfpsHandler.h ] && cp -v custom_src/udfps/UdfpsHandler.h lineage/hardware/xiaomi/fingerprint/ || true

    # 10. Set up the Android build variables and compile just the module
    - name: Compile Module
      run: |
        cd lineage
        source build/envsetup.sh
        # Provide fallback targets to ensure it satisfies Android 14 release flags
        lunch lineage_arm64-ap3a-userdebug || lunch lineage_arm64-trunk_staging-userdebug || lunch lineage_arm64-userdebug
        m libudfpshandler -j$(nproc)

    # 11. Save the compiled library
    - name: Upload Compiled Binary
      uses: actions/upload-artifact@v4
      with:
        name: libudfpshandler-binary
        path: lineage/out/target/product/*/vendor/lib64/libudfpshandler.so
