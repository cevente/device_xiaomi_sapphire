name: Android UDFPS Module CI

on:
  push:
    branches: [ "lineage-23.2" ]
  pull_request:
    branches: [ "lineage-23.2" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PATH: ${{ github.workspace }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
    - name: Free Disk Space (Alternative)
      run: |
        echo "Freeing disk space..."
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/share/swift
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /usr/local/share/chromium
        sudo rm -rf /usr/local/lib/node_modules
        sudo rm -rf /opt/microsoft/powershell
        sudo rm -rf /opt/pipx
        sudo rm -rf /usr/share/miniconda
        sudo rm -rf /usr/local/graalvm
        sudo rm -rf /usr/local/julia*
        sudo rm -rf /usr/local/phantomjs
        sudo rm -rf /usr/local/lib/heroku
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/local/share/vcpkg
        sudo rm -rf /usr/local/share/rust
        sudo rm -rf /usr/share/dotnet
        sudo apt-get clean
        docker system prune -af || true
        echo "Disk space freed"

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libssl-dev python-is-python3
        sudo apt-get install -y repo || true

    - name: Setup Repo Tool (Local)
      run: |
        mkdir -p ~/bin
        curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH
        ~/bin/repo --version

    - name: Initialize and Sync
      run: |
        git config --global user.name "CloudBuilder"
        git config --global user.email "builder@cloud.local"
        mkdir -p lineage
        cd lineage
        ~/bin/repo init -u https://github.com/LineageOS/android.git -b lineage-21.0 --depth=1 --no-repo-verify
        ~/bin/repo sync -c -j$(nproc) --no-clone-bundle --no-tags --force-sync

    - name: Clone All Device Dependencies (Skip if exists)
      run: |
        cd lineage
        
        # Function to clone only if directory doesn't exist or is empty
        clone_if_needed() {
          local repo_url=$1
          local target_path=$2
          local branch=$3
          
          if [ -d "$target_path" ] && [ "$(ls -A $target_path)" ]; then
            echo "✓ $target_path already exists and is not empty, skipping..."
          else
            echo "Cloning $target_path..."
            rm -rf "$target_path"  # Remove if exists but empty
            if [ -n "$branch" ]; then
              git clone --depth=1 "$repo_url" -b "$branch" "$target_path"
            else
              git clone --depth=1 "$repo_url" "$target_path"
            fi
          fi
        }
        
        # Clone only if needed
        clone_if_needed "https://github.com/LineageOS/android_hardware_xiaomi.git" "hardware/xiaomi" "lineage-21.0"
        clone_if_needed "https://github.com/cevente/device_xiaomi_sapphire.git" "device/xiaomi/sapphire" ""
        clone_if_needed "https://github.com/The-Angel-Place-Sapphire/device_xiaomi_sapphire-kernel.git" "device/xiaomi/sapphire-kernel" ""
        clone_if_needed "https://github.com/The-Angel-Place-Sapphire/vendor_xiaomi_sapphire.git" "vendor/xiaomi/sapphire" ""
        
        echo -e "\n=== Directory structure ==="
        ls -la device/xiaomi/ vendor/xiaomi/ hardware/ 2>/dev/null || echo "Some directories may not exist"

    - name: Build UDFPS Module from Device Tree
      run: |
        cd lineage
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch lineage_sapphire-userdebug
        echo "Building libudfpshandler..."
        m libudfpshandler -j$(nproc)

    - name: Upload Compiled Binary
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: libudfpshandler-sapphire
        path: lineage/out/target/product/sapphire/vendor/lib64/libudfpshandler.so

    - name: Upload Build Logs (if failure)
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs
        path: |
          lineage/out/error.log
          lineage/out/build.log
          lineage/out/.module_paths/Android.bp.list
