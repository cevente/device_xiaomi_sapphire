name: Android UDFPS Module CI

on:
  push:
    branches: [ "lineage-21.0" ]
  pull_request:
    branches: [ "lineage-21.0" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        large-packages: true
        swap-storage: false

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libssl-dev python-is-python3

    - name: Initialize Repo
      run: |
        git config --global user.name "CloudBuilder"
        git config --global user.email "builder@cloud.local"
        mkdir -p lineage
        cd lineage
        repo init -u https://github.com/LineageOS/android.git -b lineage-21.0 --depth=1

    - name: Full Shallow Sync
      run: |
        cd lineage
        repo sync -c -j$(nproc) --no-clone-bundle --no-tags

    - name: Clone Dependencies (Strictly lineage-21.0)
      run: |
        # Ensure versions match manifest
        rm -rf lineage/vendor/lineage lineage/hardware/xiaomi
        git clone --depth=1 https://github.com/LineageOS/android_vendor_lineage.git -b lineage-21.0 lineage/vendor/lineage
        git clone --depth=1 https://github.com/LineageOS/android_hardware_xiaomi.git -b lineage-21.0 lineage/hardware/xiaomi

    - name: Checkout Custom Module
      uses: actions/checkout@v4
      with:
        path: custom_src

    - name: Inject Custom Code
      run: |
        cp -v custom_src/udfps/Android.bp lineage/hardware/xiaomi/fingerprint/
        cp -v custom_src/udfps/UdfpsHandler.cpp lineage/hardware/xiaomi/fingerprint/
        cp -v custom_src/udfps/xiaomi_touch.h lineage/hardware/xiaomi/fingerprint/
        [ -f custom_src/udfps/UdfpsHandler.h ] && cp -v custom_src/udfps/UdfpsHandler.h lineage/hardware/xiaomi/fingerprint/ || true

    - name: Compile Module
      run: |
        cd lineage
        # 1. Set environment variables to ignore missing device trees
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        
        # 2. Source setup
        source build/envsetup.sh
        
        # 3. Use a generic target that exists in all trees
        lunch aosp_arm64-userdebug
        
        # 4. Build the module
        m libudfpshandler -j$(nproc)

    - name: Upload Compiled Binary
      uses: actions/upload-artifact@v4
      with:
        name: libudfpshandler-binary
        path: lineage/out/target/product/*/vendor/lib64/libudfpshandler.so
