name: Android UDFPS Module CI

on:
  push:
    branches: [ "lineage-23.2" ]
  pull_request:
    branches: [ "lineage-23.2" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Install essential Android building blocks
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libssl-dev python-is-python3

    # 2. Fetch the absolute latest Repo tool from Google to override the system version
    - name: Install Latest Repo Tool
      run: |
        mkdir -p ~/.bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod a+x ~/.bin/repo
        sudo mv ~/.bin/repo /usr/local/bin/repo

    # 3. Initialize the LineageOS 23.2 source tree
    - name: Initialize Repo
      run: |
        git config --global user.name "CloudBuilder"
        git config --global user.email "builder@cloud.local"
        mkdir lineage
        cd lineage
        repo init -u https://github.com/LineageOS/android.git -b lineage-23.2 --depth=1

    # 4. Sync ONLY the generic frameworks that exist in the base tree
    - name: Shallow Sync Required Repositories
      run: |
        cd lineage
        repo sync build/make system/core hardware/interfaces prebuilts/clang/host/linux-x86 -c -j$(nproc)

    # 5. Manually clone the LineageOS Xiaomi hardware tree to get the required headers
    - name: Clone LineageOS Xiaomi Hardware Dependency
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_hardware_xiaomi.git -b lineage-23.2 lineage/hardware/xiaomi

    # 6. Checkout your custom code to a temporary directory
    - name: Checkout Custom Module
      uses: actions/checkout@v4
      with:
        path: custom_src

    # 7. Safely inject your customized code over the base fingerprint implementation
    - name: Inject Custom Code into Tree
      run: |
        cp -v custom_src/Android.bp lineage/hardware/xiaomi/fingerprint/
        cp -v custom_src/UdfpsHandler.cpp lineage/hardware/xiaomi/fingerprint/
        cp -v custom_src/xiaomi_touch.h lineage/hardware/xiaomi/fingerprint/
        [ -f custom_src/UdfpsHandler.h ] && cp -v custom_src/UdfpsHandler.h lineage/hardware/xiaomi/fingerprint/ || true

    # 8. Set up the Android build variables and compile just the module
    - name: Compile Module
      run: |
        cd lineage
        source build/envsetup.sh
        lunch lineage_arm64-userdebug
        m libudfpshandler -j$(nproc)

    # 9. Save the compiled library
    - name: Upload Compiled Binary
      uses: actions/upload-artifact@v4
      with:
        name: libudfpshandler-binary
        path: lineage/out/target/product/generic_arm64/vendor/lib64/libudfpshandler.so
