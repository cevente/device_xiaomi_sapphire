[package]
name = "udfps_handler"
version = "0.1.0"
edition = "2021"
authors = ["LineageOS Project"]
license = "Apache-2.0"
description = "UDFPS Handler for Xiaomi SM6225 devices"

[lib]
crate-type = ["cdylib", "staticlib"]
path = "src/lib.rs"

[dependencies]
libc = "0.2.153"
nix = { version = "0.28.0", features = ["fs", "ioctl", "poll", "time"] }
log = "0.4.20"
static_assertions = "1.1.0"
thiserror = "1.0.56"
tracing = { version = "0.1.40", default-features = false, features = ["std"] }

[target.'cfg(target_os="android")'.dependencies]
android_logger = "0.13.3"
android-properties = "0.2.2"

[build-dependencies]
bindgen = { version = "0.69.1", optional = true }
cc = "1.0.83"

[features]
default = ["bindgen"]
bindgen = ["dep:bindgen"]
no-std = []

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
debug = false

[package.metadata.android]
targets = ["aarch64-linux-android", "armv7-linux-androideabi"]
ndk_version = "25.2.9519653"
